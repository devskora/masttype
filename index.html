<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<!-- Primary SEO -->
<title>MastType Pro — Free Typing Test, WPM & Accuracy Tracker</title>

<meta
    name="description"
    content="MastType Pro is a free online typing test and practice platform. Test your typing speed, measure WPM and accuracy, and improve your typing skills."
>

<meta
    name="robots"
    content="index, follow"
>

<meta
    name="author"
    content="MastType Pro"
>

<link
    rel="canonical"
    href="https://devskora.github.io/masttype/"
>

<!-- Open Graph / Social Sharing -->
<meta
    property="og:type"
    content="website"
>

<meta
    property="og:title"
    content="MastType Pro — Free Typing Test"
>

<meta
    property="og:description"
    content="Test your typing speed, WPM and accuracy with MastType Pro."
>

<meta
    property="og:url"
    content="https://devskora.github.io/masttype/"
>

<meta
    property="og:site_name"
    content="MastType Pro"
>

<!-- Twitter / X -->
<meta
    name="twitter:card"
    content="summary"
>

<meta
    name="twitter:title"
    content="MastType Pro — Free Typing Test"
>

<meta
    name="twitter:description"
    content="Free typing practice and typing tests with WPM and accuracy tracking."
>

<!-- Favicon -->
<link
    rel="icon"
    href="./favicon.ico"
>

<!-- Stylesheet -->
<link
    rel="stylesheet"
    href="./style.css"
>
   

</head>

<body>

   
<!-- Skip Navigation -->
<a
    class="skip-link"
    href="#main-content"
>
    Skip to main content
</a>

<!-- Custom Cursor -->
<div
    class="cursor"
    aria-hidden="true"
></div>

<header class="header">
    <nav
        class="header-nav"
        aria-label="Main navigation"
    >
        <ul>
            <li class="header-link-list-item">
                <a
                    href="./index.html"
                    class="header-link"
                    aria-current="page"
                >
                    HOME
                </a>
            </li>

            <li class="header-link-list-item">
                <a
                    href="#typing"
                    class="header-link"
                >
                    TYPING
                </a>
            </li>

            <li class="header-link-list-item">
                <a
                    href="./result.html"
                    class="header-link"
                >
                    RESULTS
                </a>
            </li>
        </ul>

        <button
            type="button"
            class="theme-btn"
            aria-label="Switch to dark mode"
            title="Toggle theme"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
            >
                <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/>
            </svg>
        </button>
    </nav>
</header>

<main
    class="main"
    id="main-content"
>

    <section
        class="hero"
        aria-labelledby="page-title"
    >
        <h1 id="page-title">
            MastType Pro
        </h1>

        <p>
            Free typing tests to measure your WPM, accuracy,
            and improve your typing speed.
        </p>
    </section>

    <section
        class="typing"
        id="typing"
        aria-labelledby="typing-heading"
    >

        <h2
            class="sub-heading"
            id="typing-heading"
        >
            Typing Test
        </h2>

        <!-- Test Settings -->
        <section
            class="setting"
            aria-label="Typing test settings"
        >

            <div class="mode sub-setting">
                <button
                    type="button"
                    class="btn time-word"
                    aria-pressed="true"
                >
                    Time
                </button>
            </div>

            <div class="time sub-setting">

                <div>
                    <label
                        for="time-controller"
                        class="sr-only"
                    >
                        Test duration
                    </label>

                    <select
                        class="btn time-controller"
                        id="time-controller"
                        name="time"
                        disabled
                    >
                        <option value="10">10 seconds</option>
                        <option value="20">20 seconds</option>
                        <option value="30">30 seconds</option>
                        <option value="45">45 seconds</option>
                        <option value="60">1 minute</option>
                        <option value="120">2 minutes</option>
                    </select>
                </div>

                <div>
                    <label
                        for="word-controller"
                        class="sr-only"
                    >
                        Number of words
                    </label>

                    <select
                        class="btn word-controller"
                        id="word-controller"
                        name="words"
                    >
                        <option value="10">10 words</option>
                        <option value="20">20 words</option>
                        <option value="40">40 words</option>
                        <option value="80">80 words</option>
                        <option value="100">100 words</option>

                    </select>

                </div>

            </div>
        </section>

        <!-- Typing Area -->
        <section
            class="paragraph-area"
            aria-label="Typing test area"
        >

            <p
                class="paragraph"
                aria-label="Text to type"
            >
                <span
                    class="typed"
                    aria-hidden="true"
                ></span>

                <span
                    class="type-able-text"
                ></span>
            </p>

            <!-- Live status for screen readers -->
            <div
                class="sr-only"
                aria-live="polite"
                aria-atomic="true"
                id="typing-status"
            ></div>

            <button
                type="button"
                class="restart btn"
                onclick="isRestart()"
                aria-label="Restart typing test"
                title="Restart typing test"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                >
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                </svg>
            </button>

        </section>

    </section>

</main>



<!-- Main JavaScript -->
<script src="./script.js" module></script>


</body>
</html>
