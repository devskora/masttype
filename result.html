<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character Encoding & Technical Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Primary SEO -->
    <title>Typing Test Results — WPM & Accuracy | MastType Pro</title>
    <meta name="description" content="View your MastType Pro typing test results, including WPM, accuracy, typing mistakes, test duration, and typing performance history.">
    <meta name="keywords" content="typing test results, WPM calculator, typing accuracy, MastType Pro history, speed typing stats">
    <meta name="robots" content="index, follow">
    <meta name="author" content="MastType Pro">
    <meta name="theme-color" content="#4169e1">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://devskora.github.io/masttype/result.html">

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Typing Test Results — MastType Pro">
    <meta property="og:description" content="Track your WPM speed, accuracy rate, mistake logs, and typing performance history with MastType Pro.">
    <meta property="og:url" content="https://devskora.github.io/masttype/result.html">
    <meta property="og:site_name" content="MastType Pro">
    <meta property="og:image" content="https://devskora.github.io/masttype/favicon.png">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Typing Test Results — MastType Pro">
    <meta name="twitter:description" content="Track your typing speed, WPM, accuracy, and performance with MastType Pro.">
    <meta name="twitter:image" content="https://devskora.github.io/masttype/favicon.png">

    <!-- Favicon & Touch Icons -->
    <link rel="icon" href="./favicon.png" type="image/svg+xml">
    <link rel="alternate icon" href="./favicon.png" type="image/x-icon">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="./result.css">

    <!-- Structured Data (JSON-LD for Rich Search Snippets) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Typing Test Results — MastType Pro",
      "description": "View detailed stats of your typing speed, accuracy, and history on MastType Pro.",
      "url": "https://devskora.github.io/masttype/result.html",
      "isPartOf": {
        "@type": "WebSite",
        "name": "MastType Pro",
        "url": "https://devskora.github.io/masttype/"
      }
    }
    </script>
</head>

<body>

    <!-- Accessibility: Skip Navigation -->
    <a class="skip-link" href="#main-content">
        Skip to main content
    </a>

    <!-- Visual Decorative Cursor -->
    <div class="cursor" aria-hidden="true"></div>

    <!-- =========================
         Header / Navigation
    ========================== -->
    <header class="header">
        <nav class="header-nav" aria-label="Main navigation">
            <ul class="header-menu">
                <li class="header-link-list-item">
                    <a href="./index.html" class="header-link">HOME</a>
                </li>
                <li class="header-link-list-item">
                    <a href="./index.html#typing" class="header-link">TYPING</a>
                </li>
                <li class="header-link-list-item">
                    <a href="./result.html" class="header-link" aria-current="page">RESULTS</a>
                </li>
            </ul>

            <!-- Theme Toggle Button -->
            <button
                type="button"
                class="theme-btn"
                aria-label="Toggle dark and light theme"
                aria-pressed="false"
                title="Toggle Theme"
            >
                <!-- Moon Icon (Dark Mode) -->
                <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/>
                </svg>
            </button>
        </nav>
    </header>

    <!-- =========================
         Main Content
    ========================== -->
    <main class="main" id="main-content" tabindex="-1">

        <!-- Hero Section -->
        <section class="hero" aria-labelledby="page-title">
            <h1 id="page-title">Typing Test Results</h1>
            <p>View your typing speed, accuracy, mistakes, and previous test performance.</p>
        </section>

        <!-- Dynamic Results Section -->
        <section 
            class="results" 
            id="results-container"
            aria-labelledby="results-heading" 
            aria-live="polite" 
            aria-atomic="true"
        >
            <h2 id="results-heading" class="sr-only">Your typing test results history</h2>
            
            <!-- Dynamic Result Cards injected via result.js -->
        </section>

    </main>

    <!-- Optimized Script Load -->
    <script src="./result.js" type="module" defer></script>

</body>
</html>
