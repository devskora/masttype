<!DOCTYPE html>

<html lang="en">
<head>
    <!-- Character Encoding -->
    <meta charset="UTF-8">


<!-- Responsive Viewport -->
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<!-- Primary SEO -->
<title>
    Typing Test Results — WPM & Accuracy | MastType Pro
</title>

<meta
    name="description"
    content="View your MastType Pro typing test results, including WPM, accuracy, typing mistakes, test duration, and typing performance history."
>

<meta
    name="robots"
    content="index, follow"
>

<meta
    name="author"
    content="MastType Pro"
>

<meta
    name="theme-color"
    content="#4169e1"
>

<!-- Canonical URL -->
<link
    rel="canonical"
    href="https://devskora.github.io/masttype/result.html"
>

<!-- Open Graph -->
<meta
    property="og:type"
    content="website"
>

<meta
    property="og:title"
    content="Typing Test Results — MastType Pro"
>

<meta
    property="og:description"
    content="View your WPM, accuracy, mistakes, and typing performance history with MastType Pro."
>

<meta
    property="og:url"
    content="https://devskora.github.io/masttype/result.html"
>

<meta
    property="og:site_name"
    content="MastType Pro"
>

<!-- Twitter / X -->
<meta
    name="twitter:card"
    content="summary"
>

<meta
    name="twitter:title"
    content="Typing Test Results — MastType Pro"
>

<meta
    name="twitter:description"
    content="Track your typing speed, WPM, accuracy, and performance with MastType Pro."
>

<!-- Favicon -->
<link
    rel="icon"
    href="./favicon.ico"
>

<!-- Stylesheet -->
<link
    rel="stylesheet"
    href="./result.css"
>
 

</head>

<body>

 
<!-- Skip Navigation -->
<a
    class="skip-link"
    href="#main-content"
>
    Skip to main content
</a>


<!-- Decorative Custom Cursor -->
<div
    class="cursor"
    aria-hidden="true"
></div>


<!-- =========================
     Header / Navigation
========================== -->

<header class="header">

    <nav
        class="header-nav"
        aria-label="Main navigation"
    >

        <ul>

            <li class="header-link-list-item">
                <a
                    href="./index.html"
                    class="header-link"
                >
                    HOME
                </a>
            </li>

            <li class="header-link-list-item">
                <a
                    href="./index.html#typing"
                    class="header-link"
                >
                    TYPING
                </a>
            </li>

            <!-- <li class="header-link-list-item">
                <a
                    href="./index.html#games"
                    class="header-link"
                >
                    GAMES
                </a>
            </li> -->

            <li class="header-link-list-item">
                <a
                    href="./result.html"
                    class="header-link"
                    aria-current="page"
                >
                    RESULTS
                </a>
            </li>

        </ul>


        <!-- Theme Toggle -->

        <button
            type="button"
            class="theme-btn"
            aria-label="Switch to dark mode"
            aria-pressed="false"
            title="Toggle dark mode"
        >

            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
            >
                <path
                    d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"
                />
            </svg>

        </button>

    </nav>

</header>


<!-- =========================
     Main Content
========================== -->

<main
    class="main"
    id="main-content"
>

    <!-- Page Introduction -->

    <section
        class="hero"
        aria-labelledby="page-title"
    >

        <h1 id="page-title">
            Typing Test Results
        </h1>

        <p>
            View your typing speed, accuracy, mistakes,
            and previous test performance.
        </p>

    </section>


    <!-- Results -->

    <section
        class="results"
        aria-labelledby="results-heading"
        aria-live="polite"
    >

        <h2
            id="results-heading"
            class="sr-only"
        >
            Your typing test results
        </h2>

        <!--
            Result cards are generated dynamically
            by result.js.
        -->

    </section>

</main>


<!-- JavaScript -->

<script src="./result.js" module></script>
 

</body>
</html>
